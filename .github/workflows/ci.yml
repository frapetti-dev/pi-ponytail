name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Typecheck (once extensions/*.ts exist)
        run: if ls extensions/*.ts >/dev/null 2>&1; then bun run typecheck; fi
      - name: Test (once tests exist)
        run: if ls tests/*.test.ts >/dev/null 2>&1; then bun test; fi
      - run: npm pack --dry-run
